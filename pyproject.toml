[project]
name = "agent-stack"
version = "0.1.0"
description = "A personal agent runtime with terminal, Telegram and web gateways"
readme = "README.md"
authors = [
    { name = "aayush joshi", email = "joshiaayush1244@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.7",
    "langchain>=1.4.2",
    "langchain-openrouter>=0.2.9",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
agent-stack = "agent_stack:main"

[project.optional-dependencies]
local = [
    "langchain-ollama>=1.1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "hvac.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: real dependency (DB/filesystem/process) test",
    "llm: test that calls a real model provider (opt-in)",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
